<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 400px;
            height: 300px;
            background: #ffffff;
            font-family: 'Arial Black', sans-serif;
            overflow: hidden;
        }
        .preview {
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, #000 25%, #fff 25%, #fff 50%, #000 50%, #000 75%, #fff 75%);
            background-size: 20px 20px;
            border: 4px solid #ff0040;
            position: relative;
        }
        .header {
            background: #000;
            color: #fff;
            padding: 10px 20px;
            border-bottom: 4px solid #ff0040;
        }
        .logo {
            font-size: 24px;
            font-weight: 900;
            transform: skew(-5deg);
            text-shadow: 2px 2px 0 #ff0040;
        }
        .content {
            padding: 30px 20px;
        }
        .title {
            font-size: 32px;
            font-weight: 900;
            color: #000;
            text-transform: uppercase;
            margin-bottom: 15px;
            text-shadow: 3px 3px 0 #ff0040;
            transform: rotate(-2deg);
        }
        .subtitle {
            background: #ff0040;
            color: #fff;
            padding: 8px 15px;
            border: 3px solid #000;
            font-weight: 700;
            transform: skew(-3deg);
            display: inline-block;
            margin-bottom: 20px;
        }
        .elements {
            display: flex;
            gap: 10px;
            position: absolute;
            bottom: 20px;
            right: 20px;
        }
        .element {
            width: 30px;
            height: 30px;
            border: 2px solid #000;
        }
        .element:nth-child(1) { background: #000; transform: rotate(15deg); }
        .element:nth-child(2) { background: #ff0040; transform: rotate(-15deg); }
        .element:nth-child(3) { background: #fff; border-color: #ff0040; transform: rotate(30deg); }
    </style>
</head>
<body>
    <div class="preview">
        <div class="header">
            <div class="logo">BRUTAL</div>
        </div>
        <div class="content">
            <div class="title">xxxx</div>
            <div class="subtitle">xxxx</div>
        </div>
        <div class="elements">
            <div class="element"></div>
            <div class="element"></div>
            <div class="element"></div>
        </div>
    </div>
</body>
</html>
