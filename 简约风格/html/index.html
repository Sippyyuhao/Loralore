<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="xxxx" />
    <meta name="keywords" content="xxxx" />
    <meta name="author" content="xxxx" />
    <title>Loralore简约模板 - 个人主页</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="stylesheet" href="css/index.css">
</head>

<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <a href="#home">Loralore</a>
            </div>
            <div class="nav-menu">
                <a href="#home" class="nav-link">首页</a>
                <a href="#about" class="nav-link">关于</a>
                <a href="#portfolio" class="nav-link">作品</a>
                <a href="#contact" class="nav-link">联系</a>
            </div>
            <div class="menu-toggle">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <!-- 主页部分 -->
    <section id="home" class="hero">
        <div class="hero-content">
            <h1>xxxx</h1>
            <p>xxxx</p>
            <a href="#about" class="btn">了解更多</a>
        </div>
    </section>

    <!-- 关于部分 -->
    <section id="about" class="about">
        <div class="container">
            <h2>关于我</h2>
            <div class="about-content">
                <div class="about-text">
                    <p>xxxx</p>
                    <p>xxxx</p>
                </div>
                <div class="about-skills">
                    <h3>技能</h3>
                    <div class="skill-item">
                        <span>xxxx</span>
                        <div class="skill-bar">
                            <div class="skill-progress" style="width: 90%"></div>
                        </div>
                    </div>
                    <div class="skill-item">
                        <span>xxxx</span>
                        <div class="skill-bar">
                            <div class="skill-progress" style="width: 85%"></div>
                        </div>
                    </div>
                    <div class="skill-item">
                        <span>xxxx</span>
                        <div class="skill-bar">
                            <div class="skill-progress" style="width: 80%"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- 作品集部分 -->
    <section id="portfolio" class="portfolio">
        <div class="container">
            <h2>我的作品</h2>
            <div class="portfolio-grid">
                <div class="portfolio-item">
                    <div class="portfolio-image">
                        <div class="placeholder-image">xxxx</div>
                    </div>
                    <div class="portfolio-info">
                        <h3>项目标题</h3>
                        <p>xxxx</p>
                    </div>
                </div>
                <div class="portfolio-item">
                    <div class="portfolio-image">
                        <div class="placeholder-image">xxxx</div>
                    </div>
                    <div class="portfolio-info">
                        <h3>项目标题</h3>
                        <p>xxxx</p>
                    </div>
                </div>
                <div class="portfolio-item">
                    <div class="portfolio-image">
                        <div class="placeholder-image">xxxx</div>
                    </div>
                    <div class="portfolio-info">
                        <h3>项目标题</h3>
                        <p>xxxx</p>
                    </div>
                </div>
                <div class="portfolio-item">
                    <div class="portfolio-image">
                        <div class="placeholder-image">xxxx</div>
                    </div>
                    <div class="portfolio-info">
                        <h3>项目标题</h3>
                        <p>xxxx</p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- 联系部分 -->
    <section id="contact" class="contact">
        <div class="container">
            <h2>联系我</h2>
            <div class="contact-content">
                <div class="contact-info">
                    <div class="contact-item">
                        <h3>邮箱</h3>
                        <p>xxxx@example.com</p>
                    </div>
                    <div class="contact-item">
                        <h3>电话</h3>
                        <p>xxxx-xxxx-xxxx</p>
                    </div>
                    <div class="contact-item">
                        <h3>地址</h3>
                        <p>xxxx</p>
                    </div>
                </div>
                <form class="contact-form">
                    <div class="form-group">
                        <input type="text" placeholder="姓名" required>
                    </div>
                    <div class="form-group">
                        <input type="email" placeholder="邮箱" required>
                    </div>
                    <div class="form-group">
                        <textarea placeholder="消息" rows="5" required></textarea>
                    </div>
                    <button type="submit" class="btn">发送消息</button>
                </form>
            </div>
        </div>
    </section>

    <!-- 页脚 -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <p>&copy; 2024 Loralore. 保留所有权利。</p>
                <div class="social-links">
                    <a href="#">xxxx</a>
                    <a href="#">xxxx</a>
                    <a href="#">xxxx</a>
                </div>
            </div>
        </div>
    </footer>

    <script src="js/main.js"></script>
</body>

</html>
