            <h2>关于“影 - 个人影像馆”</h2>
            <p>“影 - 个人影像馆”是一个简洁美观的个人相册与影像管理平台，支持图片浏览、相册管理、大图预览、背景模糊等现代化交互体验。</p>
            <h3>主要功能</h3>
            <ul>
                <li><i class="fas fa-images"></i> 瀑布流图片浏览与搜索</li>
                <li><i class="fas fa-folder-open"></i> 相册分组与管理</li>
                <li><i class="fas fa-eye"></i> 大图弹窗预览与背景模糊</li>
                <li><i class="fas fa-heart"></i> 图片点赞收藏</li>
                <li><i class="fas fa-upload"></i> 本地图片上传（演示版为占位图）</li>
                <li><i class="fas fa-mobile-alt"></i> 响应式设计，适配多端</li>
            </ul>
            <h3>联系方式</h3>
            <ul>
                <li><i class="fas fa-envelope"></i> 邮箱：your@email.com</li>
                <li><i class="fab fa-github"></i> GitHub：<a href="https://github.com/your-repo" target="_blank">your-repo</a></li>
            </ul>
            <h3>致谢</h3>
