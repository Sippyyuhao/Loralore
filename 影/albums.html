<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>相册 - 影</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="main-header">
        <div class="container">
            <h1 class="logo">影<span class="logo-alt"> - 个人影像馆</span></h1>
            <nav class="main-nav">
                <a href="index.html" class="nav-link">所有作品</a>
                <a href="albums.html" class="nav-link active">相册</a>
                <a href="about.html" class="nav-link">关于</a>
            </nav>
            <div class="header-actions">
                 <button id="add-album-btn" class="btn btn-primary"><i class="fas fa-plus"></i> 新建相册</button>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="page-title">
             </div>
        <div class="album-grid">
            <!-- Album items will be generated here -->
            <div class="album-item">
                <div class="album-cover">
                    <img src="images/placeholder1.jpg" alt="Album Cover">
                    <div class="album-overlay">
                        <i class="fas fa-images"></i>
                    </div>
                </div>
                <div class="album-info">
                    <h3>风景</h3>
                    <p>12 张照片</p>
                </div>
            </div>
             <div class="album-item">
                <div class="album-cover">
                    <img src="images/placeholder2.jpg" alt="Album Cover">
                     <div class="album-overlay">
                        <i class="fas fa-images"></i>
                    </div>
                </div>
                <div class="album-info">
                    <h3>人像</h3>
                    <p>8 张照片</p>
                </div>
            </div>
             <div class="album-item">
                <div class="album-cover">
                    <img src="images/placeholder3.jpg" alt="Album Cover">
                     <div class="album-overlay">
                        <i class="fas fa-images"></i>
                    </div>
                </div>
                <div class="album-info">
                    <h3>生活</h3>
                    <p>25 张照片</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Album Detail View -->
    <div id="album-detail-view" class="album-detail-view">
        <div class="album-detail-header">
            <button id="back-to-albums" class="back-btn"><i class="fas fa-arrow-left"></i> 返回</button>
            <h2 id="album-detail-title" contenteditable="true">相册名称</h2>
            <div class="album-actions">
                <button id="add-photo-btn" class="btn btn-primary"><i class="fas fa-plus"></i> 添加照片</button>
            </div>
        </div>
        <div id="album-detail-grid" class="gallery-grid">
            <!-- Photos of the selected album will be displayed here -->
        </div>
    </div>
    
    <div id="add-album-modal" class="modal-overlay">
        <div class="modal-content">
            <button class="modal-close">&times;</button>
            <h2>新建相册</h2>
            <div class="form-group">
                <label for="album-name">相册名称</label>
                <input type="text" id="album-name" placeholder="输入相册名称...">
            </div>
            <button id="confirm-add-album" class="btn btn-primary">确认创建</button>
        </div>
    </div>

    <div id="album-image-detail-modal" class="modal-overlay">
        <button class="modal-close">&times;</button>
        <div class="image-detail-content">
            <h3 id="album-modal-image-title" class="image-title"></h3>
            <img src="" alt="Full size view" id="album-modal-image-element">
            <div class="image-metadata">
                <span id="album-meta-date"></span>
                <span id="album-meta-size"></span>
            </div>
            <a href="#" class="btn btn-primary download-btn" id="album-download-btn" download><i class="fas fa-download"></i> 下载</a>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script src="js/albums.js"></script>
</body>
</html>
