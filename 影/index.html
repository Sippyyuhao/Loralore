<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>影 - 个人影像馆</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="main-header">
        <div class="container">
            <h1 class="logo">影<span class="logo-alt"> - 个人影像馆</span></h1>
            <nav class="main-nav">
                <a href="index.html" class="nav-link active">所有作品</a>
                <a href="albums.html" class="nav-link">相册</a>
                <a href="about.html" class="nav-link">关于</a>
            </nav>
            <div class="header-actions">
                <button id="upload-btn" class="btn btn-primary"><i class="fas fa-plus"></i> 上传</button>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="toolbar">
            <div class="search-box">
                <input type="text" placeholder="搜索作品...">
                <i class="fas fa-search"></i>
            </div>
            <div class="filter-options">
                <span>排序:</span>
                <select id="sort-filter">
                    <option value="latest">最新</option>
                    <option value="oldest">最早</option>
                    <option value="liked">已点赞</option>
                </select>
            </div>
        </div>

        <div id="gallery" class="gallery-grid">
            <!-- Gallery items will be injected by JavaScript -->
        </div>
    </main>

    <div id="image-detail-modal" class="modal-overlay">
        <button class="modal-close">&times;</button>
        <div class="image-detail-content">
            <h3 id="modal-image-title" class="image-title"></h3>
            <img src="" alt="Full size view" id="modal-image-element">
            <div class="image-metadata">
                <span id="meta-date"></span>
                <span id="meta-size"></span>
            </div>
            <a href="#" class="btn btn-primary download-btn" download><i class="fas fa-download"></i> 下载</a>
        </div>
    </div>
    
    <script src="js/script.js"></script>
</body>
</html>
