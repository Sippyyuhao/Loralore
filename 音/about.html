<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>关于 - 音</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .about-content h2 {
            border-left: 6px solid var(--primary-color);
            padding-left: 12px;
            margin-bottom: 18px;
            font-weight: 700;
        }
        .about-content h3 {
            border-left: 4px solid var(--primary-color);
            padding-left: 8px;
            margin-top: 32px;
            margin-bottom: 12px;
            font-weight: 600;
        }
        .about-content ul li i {
            color: var(--primary-color);
            margin-right: 8px;
        }
        .about-content a {
            color: var(--primary-color);
            text-decoration: underline;
            transition: color 0.2s;
        }
        .about-content a:hover {
            color: var(--primary-hover-color);
        }
        .about-content {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.06);
            padding: 40px 32px 32px 32px;
            margin: 40px auto 60px auto;
            max-width: 800px;
        }
        .about-brand {
            background: linear-gradient(90deg, var(--primary-color) 0%, #5bc0eb 100%);
            color: #fff;
            border-radius: 8px;
            padding: 16px 20px;
            margin-bottom: 28px;
            font-size: 1.1rem;
            font-weight: 500;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

<body>
    <header class="main-header">
        <div class="container">
            <div class="logo">音<span class="logo-alt">-个人音乐站</span></div>
            <nav class="main-nav">
                <a href="index.html" class="nav-link">所有音乐</a>
                <a href="playlists.html" class="nav-link">歌单</a>

            </nav>
            <div class="header-actions">
        </div>
    </header>

    <main class="container">
        <div class="about-content">
            <div class="about-brand">
                <i class="fas fa-music"></i> 本网站基于 <b>Loralore</b> 个人云音乐站模板，专为音乐爱好者和个人音乐管理打造，风格现代、简洁、优雅。
            </div>
            <h2>关于“音 - 个人音乐站”</h2>
            <p>“音 - 个人音乐站”是一个简洁美观的个人音乐收藏与分享平台，支持音乐上传、歌单归档、在线播放、重命名等现代化交互体验，初衷是让用户保存、分享、展示自己的音乐。</p>
            <h3>主要功能</h3>
            <ul>
                <li><i class="fas fa-music"></i> 支持上传 mp3 格式音乐</li>
                <li><i class="fas fa-random"></i> 上传文件自动重命名，防止重复</li>
                <li><i class="fas fa-list"></i> 歌单归档与管理</li>
                <li><i class="fas fa-play-circle"></i> 在线播放与测试歌曲占位</li>
                <li><i class="fas fa-share-alt"></i> 支持音乐分享与展示</li>
                <li><i class="fas fa-mobile-alt"></i> 响应式设计，适配多端</li>
            </ul>
          
        </div>
    </main>

    <footer class="footer" style="text-align:center;padding:24px 0 16px 0;color:#888;font-size:1rem;">
        
        <br/>
        <span>&copy; 2025 音 - Loralore 模板</span>
