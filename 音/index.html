<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音 - 个人音乐站</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="main-header">
        <div class="container">
            <h1 class="logo">音<span class="logo-alt"> - 个人音乐站</span></h1>
            <nav class="main-nav">
                <a href="index.html" class="nav-link active">所有音乐</a>
                <a href="playlists.html" class="nav-link">歌单</a>
                <a href="about.html" class="nav-link">关于</a>
            </nav>
            <div class="header-actions">
                <button id="upload-btn" class="btn btn-primary"><i class="fas fa-upload"></i> 上传音乐</button>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="toolbar">
            <div class="search-box">
                <input type="text" placeholder="搜索音乐/歌手...">
                <i class="fas fa-search"></i>
            </div>
            <div class="filter-options">
                <span>歌单:</span>
                <select id="playlist-filter">
                    <option value="all">全部</option>
                    <option value="favorites">我的喜欢</option>
                </select>
            </div>
        </div>
        <div id="music-list" class="music-list">
            <!-- 音乐项由 JS 注入 -->
        </div>
    </main>

    <div id="music-player-modal" class="modal-overlay">
        <button class="modal-close">&times;</button>
        <div class="music-player-content">
            <h3 id="player-title" class="music-title"></h3>
            <audio id="audio-player" controls preload="auto" style="width:100%;margin:16px 0;"></audio>
            <div class="music-meta">
                <span id="player-artist"></span>
                <span id="player-album"></span>
            </div>
            <a id="download-music-btn" href="#" class="btn btn-primary download-btn" download><i class="fas fa-download"></i> 下载</a>
        </div>
    </div>

    <div id="upload-modal" class="modal-overlay">
        <div class="modal-content">
            <button class="modal-close">&times;</button>
            <h2>上传音乐</h2>
            <form id="upload-form">
                <input type="file" id="music-file" accept="audio/mp3" required>
                <input type="text" id="music-title" placeholder="歌曲名" required>
                <input type="text" id="music-artist" placeholder="歌手" required>
                <input type="text" id="music-album" placeholder="专辑" required>
                <button type="submit" class="btn btn-primary">上传</button>
            </form>
        </div>
    </div>

    <footer class="footer" style="text-align:center;padding:24px 0 16px 0;color:#888;font-size:1rem;">
       
        <br/>
        <span>&copy; 2025 音 - Loralore 模板</span>
    </footer>
    <script src="js/script.js"></script>
</body>
</html>
